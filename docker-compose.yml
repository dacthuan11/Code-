services:
  # ── Infrastructure ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway ──────────────────────────────────
  gateway:
    build:
      context: ./backend
      dockerfile: Gateway/Nexus.Gateway/Dockerfile
    container_name: nexus-gateway
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
    depends_on:
      - user-service
      - catalog-service
      - commerce-service
      - auction-service
      - fulfillment-service
      - notification-service
    restart: unless-stopped

  # ── Services ─────────────────────────────────────
  user-service:
    build:
      context: ./backend
      dockerfile: Services/UserService/Nexus.UserService.API/Dockerfile
    container_name: nexus-user-service
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build:
      context: ./backend
      dockerfile: Services/CatalogService/Nexus.CatalogService.API/Dockerfile
    container_name: nexus-catalog-service
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - Services__FulfillmentService=http://fulfillment-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  commerce-service:
    build:
      context: ./backend
      dockerfile: Services/CommerceService/Nexus.CommerceService.API/Dockerfile
    container_name: nexus-commerce-service
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_commerce;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  auction-service:
    build:
      context: ./backend
      dockerfile: Services/AuctionService/Nexus.AuctionService.API/Dockerfile
    container_name: nexus-auction-service
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_auction;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  fulfillment-service:
    build:
      context: ./backend
      dockerfile: Services/FulfillmentService/Nexus.FulfillmentService.API/Dockerfile
    container_name: nexus-fulfillment-service
    ports:
      - "5005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_fulfillment;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - GHN__Token=${GHN_TOKEN}
      - GHN__ShopId=${GHN_SHOP_ID}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: Services/NotificationService/Nexus.NotificationService.API/Dockerfile
    container_name: nexus-notification-service
    ports:
      - "5006:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexus_notification;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - App__FrontendUrl=http://localhost:3000
      - Email__UseSmtp=true
      - Email__SmtpHost=${SMTP_HOST}
      - Email__SmtpPort=${SMTP_PORT}
      - Email__EnableSsl=${SMTP_SSL}
      - Email__Username=${SMTP_USER}
      - Email__Password=${SMTP_PASS}
      - Email__FromEmail=${SMTP_FROM_EMAIL}
      - Email__FromName=${SMTP_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend SPA ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
